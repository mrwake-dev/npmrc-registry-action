name: 'NPM - .npmrc registry login'

description: 'Login to NPM registry with a .npmrc file'

branding:
  color: 'yellow'
  icon: 'file-plus'

inputs:
  scope:
    description: 'The registry scope (e.g. @acmeorg)'
    required: true
  registry:
    description: 'The registry domain (e.g. https://npm.pkg.github.com)'
    required: true
  auth-token:
    description: 'The registry auth token'
    required: true
  path:
    description: 'The directory to manage the .npmrc file in (defaults to the currnet directory)'
    required: false

runs:
  using: 'node20'
  main: 'dist/main.js'